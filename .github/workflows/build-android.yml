
name: Build Ayham Football APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP project
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import zipfile
          import os

          files = glob.glob("*.zip")
          if not files:
              raise SystemExit("ERROR: No ZIP file found in repository root")

          archive = files[0]
          print("Extracting:", archive)

          with zipfile.ZipFile(archive) as z:
              z.extractall("game-project")
          PY

      - name: Find Godot project
        shell: bash
        run: |
          PROJECT_FILE=$(find game-project -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found inside ZIP"
            find game-project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Import resources
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ayham Football,O=Ayham,C=IQ"

      - name: Export APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/AyhamFootball.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayham-Football-APK
          path: game-project/**/*.apk
          if-no-files-found: error
