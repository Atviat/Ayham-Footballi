
name: Build Ayham Football APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract ZIP
      - name: Extract ZIP project
        shell: bash
        run: |
          mkdir -p game-project

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d game-project

      # 3. Find Godot project
      - name: Find Godot project
        shell: bash
        run: |
          PROJECT_FILE=$(find game-project -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            find game-project -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      # 4. Create debug keystore
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ayham Football,O=Ayham,C=IQ"

      # 5. Configure Android SDK and Java
      - name: Configure Android SDK and Java
        shell: bash
        run: |
          ANDROID_JAR=$(find / -type f -path '*/platforms/android-*/android.jar' -print -quit 2>/dev/null)

          if [ -z "$ANDROID_JAR" ]; then
            echo "ERROR: Android SDK platform not found!"
            exit 1
          fi

          ANDROID_SDK=$(dirname "$(dirname "$(dirname "$ANDROID_JAR")")")

          JAVAC=$(command -v javac)

          if [ -z "$JAVAC" ]; then
            echo "ERROR: Java compiler not found!"
            exit 1
          fi

          JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$JAVAC")")")

          SDKMANAGER=$(find "$ANDROID_SDK" -type f -name sdkmanager -print -quit 2>/dev/null)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            find "$ANDROID_SDK" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses || true

          echo "Installing Android build tools..."

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "AndroidDebugKey"
          export/android/debug_keystore_password = "android"
          EOF

          echo "Android SDK: $ANDROID_SDK"
          echo "Java SDK: $JAVA_HOME"

      # 6. Install Godot export templates
      - name: Install Godot export templates
        shell: bash
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot-templates

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot-templates

          SOURCE=$(find /tmp/godot-templates -type f -name android_debug.apk -print -quit)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: Android export templates not found!"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$SOURCE")

          cp -a "$SOURCE_DIR/." "$TEMPLATE_DIR/"

          echo "Godot Android templates installed."

      # 7. Import project
      - name: Import project resources
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      # 8. Export APK
      - name: Export Android TV APK
        run: |
          mkdir -p "$PROJECT_DIR/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/AyhamFootball.apk"

      # 9. Verify APK
      - name: Verify APK
        run: |
          if [ ! -s "$PROJECT_DIR/build/AyhamFootball.apk" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh "$PROJECT_DIR/build/AyhamFootball.apk"

      # 10. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayham-Football-Android-TV
          path: game-project/**/build/AyhamFootball.apk
          if-no-files-found: error
          retention-days: 14
