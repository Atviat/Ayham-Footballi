
name: Build Ayham Football Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p build

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/AyhamFootball.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayham-Football-Android-APK
          path: build/AyhamFootball.apk
          if-no-files-found: error
