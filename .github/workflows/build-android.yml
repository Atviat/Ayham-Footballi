
name: Build Ayham Football APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Godot project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -name project.godot -not -path './.git/*' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Import project resources
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/AyhamFootball.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayham-Football-Android-APK
          path: "**/AyhamFootball.apk"
          if-no-files-found: error
