
name: Build Ayham Football APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP project
        shell: bash
        run: |
          mkdir -p game-project

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d game-project

          echo "Extracted project files:"
          find game-project -maxdepth 5 -type f | head -100

      - name: Find Godot project
        shell: bash
        run: |
          PROJECT_FILE=$(find game-project -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project found: $PROJECT_DIR"

      - name: Import project resources
        run: |
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ayham Football,O=Ayham,C=IQ"

      - name: Export Android APK
        run: |
          mkdir -p "$PROJECT_DIR/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/AyhamFootball.apk"

      - name: Verify APK
        run: |
          test -f "$PROJECT_DIR/build/AyhamFootball.apk"
          ls -lh "$PROJECT_DIR/build/AyhamFootball.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayham-Football-Android-APK
          path: game-project/**/build/AyhamFootball.apk
          if-no-files-found: error
